name: Hourly Forward Test

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-forward-test
  cancel-in-progress: false

jobs:
  run-desk:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      PAPER_TRADING: 'true'
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Generate predictions
        run: trading-desk run-hourly
      - name: Grade due predictions
        run: trading-desk grade
      - name: Commit updated research ledger
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "trading-desk-bot@users.noreply.github.com"
          git add data/predictions.jsonl
          if git diff --cached --quiet; then
            echo "No ledger changes"
          else
            git commit -m "Record hourly forward-test observations"
            git push
          fi
