[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-desk"
version = "0.1.0"
description = "Constrained crypto multi-agent research and paper-trading desk"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.42.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
trading-desk = "trading_desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
